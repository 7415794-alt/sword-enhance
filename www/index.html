<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14110f">
  <meta name="description" content="검 강화하기 - 검을 강화하고 팔아서 전설의 검을 완성하세요">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="검 강화하기">
  <title>검 강화하기</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="hud">
      <div class="res gold"><span>💰</span><b id="gold">0</b></div>
      <div class="res frag" title="검 조각 (파괴 시 획득)"><span>🔩</span><b id="frag">0</b></div>
      <div class="res best" title="최고 강화 기록"><span>🏆</span><b id="best">+0</b></div>
    </header>

    <main id="views">
      <!-- 강화 -->
      <section class="view active" data-view="forge">
        <div class="anvil">
          <div class="sword-name" id="swordName"></div>
          <div class="weapon-info" id="weaponInfo"></div>
          <div class="sword-wrap" id="swordWrap"><div id="sword"></div><div class="fx" id="fx"></div></div>
          <div class="result" id="result"></div>
        </div>

        <div class="odds" id="odds"></div>

        <div class="items" id="useItems"></div>

        <div class="actions">
          <button class="btn sell" id="sellBtn"><span>판매</span><small id="sellPrice"></small></button>
          <button class="btn enhance" id="enhanceBtn"><span>강화</span><small id="cost"></small></button>
          <button class="btn auto" id="autoBtn"></button>
        </div>
      </section>

      <!-- 상점 -->
      <section class="view" data-view="shop">
        <h2>보조 아이템 상점</h2>
        <p class="hint">골드 가격은 최고 강화 기록이 오를수록 비싸집니다. 검 조각은 검이 파괴될 때 얻습니다.</p>
        <div id="shopList" class="list"></div>
      </section>

      <!-- 도감 -->
      <section class="view" data-view="dex">
        <h2>무기 도감 <small id="wdexCount"></small></h2>
        <p class="hint">판매하거나 파괴되면 새 무기가 무작위로 나옵니다. 발견한 무기 하나당 판매가 <b>+2%</b>.</p>
        <div id="weaponDex" class="wdex"></div>
        <h2>강화 도감 <small id="dexCount"></small></h2>
        <p class="hint">처음 도달한 강화 단계가 등록됩니다. 한 칸당 판매가 <b>+1%</b>.</p>
        <div id="dexGrid" class="dex"></div>
      </section>

      <!-- 업적 -->
      <section class="view" data-view="ach">
        <div class="ach-head"><h2>업적 <small id="achCount"></small></h2><button class="btn small" id="claimAll">모두 받기</button></div>
        <div class="cats" id="achCats"></div>
        <div id="achList" class="list"></div>
      </section>

      <!-- 기록 · 랭킹 -->
      <section class="view" data-view="rank">
        <h2>최고 판매 랭킹</h2>
        <p class="hint">이 기기에서 판매한 검 중 가장 비싼 10자루입니다.</p>
        <ol id="rankList" class="rank"></ol>
        <h2>통계</h2>
        <div id="stats" class="stats"></div>
        <div class="settings">
          <button class="btn small" id="soundBtn"></button>
          <button class="btn small danger" id="resetBtn">처음부터 다시</button>
        </div>
        <p class="ver" id="ver"></p>
      </section>
    </main>

    <nav class="tabs" id="tabs">
      <button data-tab="forge" class="active"><span>🔨</span>강화</button>
      <button data-tab="shop"><span>🛒</span>상점</button>
      <button data-tab="dex"><span>📖</span>도감</button>
      <button data-tab="ach"><span>🏅</span>업적<i class="dot" id="achDot"></i></button>
      <button data-tab="rank"><span>👑</span>기록</button>
    </nav>

    <div class="toast" id="toast"></div>

    <!-- 자동 강화 설정 -->
    <div class="sheet-bg" id="autoSheet">
      <div class="sheet">
        <h3>⚙️ 자동 강화</h3>
        <div class="field">
          <label>목표 단계</label>
          <div class="stepper">
            <button data-step="-10">-10</button><button data-step="-1">-1</button>
            <b id="autoTarget">+10</b>
            <button data-step="1">+1</button><button data-step="10">+10</button>
          </div>
          <button class="link" data-step="0">최고 기록 +1로 맞추기</button>
        </div>
        <div class="field">
          <label>목표에 도달하면</label>
          <div class="seg-btns"><button data-opt="onTarget:sell">판매하고 반복</button><button data-opt="onTarget:stop">멈춤</button></div>
        </div>
        <div class="field">
          <label>무기가 파괴되면</label>
          <div class="seg-btns"><button data-opt="onDestroy:continue">새 무기로 계속</button><button data-opt="onDestroy:stop">멈춤</button></div>
        </div>
        <div class="field">
          <label>사용할 아이템 <small>(떨어지면 조각 → 골드로 자동 구매)</small></label>
          <div id="autoItems" class="checks"></div>
        </div>
        <div class="field">
          <label>속도</label>
          <div class="seg-btns"><button data-opt="fast:false">보통</button><button data-opt="fast:true">빠르게</button></div>
        </div>
        <div class="sheet-actions">
          <button class="btn small alt" id="autoClose">닫기</button>
          <button class="btn enhance" id="autoStart"><span>▶ 시작</span></button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
